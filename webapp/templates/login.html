<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — CyberScan</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>

  <div class="login-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-card login-card animate-entry">
      <div style="text-align: center; margin-bottom: 30px;">
        <div style="margin: 0 auto 20px; width: 240px; height: 60px;">
          <img src="/static/logo.png" alt="CyberScan Logo"
            style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));">
        </div>
        <h2>CyberScan</h2>
        <p style="margin-top: 8px; font-size: 0.9rem;">Advanced Sonic Reconnaissance</p>
      </div>

      {% if error %}
      <div
        style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
        <ion-icon name="alert-circle"></ion-icon>
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        <div class="form-group">
          <label>Username</label>
          <div style="position: relative;">
            <input name="username" type="text" placeholder="Enter username" required style="padding-left: 40px;">
            <ion-icon name="person-outline"
              style="position: absolute; left: 12px; top: 14px; color: var(--text-secondary); pointer-events: none;"></ion-icon>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div style="position: relative;">
            <input name="password" type="password" placeholder="Enter password" required style="padding-left: 40px;">
            <ion-icon name="lock-closed-outline"
              style="position: absolute; left: 12px; top: 14px; color: var(--text-secondary); pointer-events: none;"></ion-icon>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Authenticate <ion-icon name="finger-print-outline"></ion-icon>
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <p style="font-size: 0.8rem; opacity: 0.7;">
          Default: <strong>admin</strong> / <strong>password</strong>
        </p>
      </div>
    </div>
  </div>

</body>

</html>
